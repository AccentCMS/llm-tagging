# Model provided by the llm-tagging plugin (Feature f112e).
#
# Pages using the `llm-article` template are expected to have AI-generated
# tags and leads. The plugin validates that required analysis fields are
# present when auto_analyze is enabled.

name: LLM Article
description: Content page with AI-generated tags and lead summary

fields:
  title:
    type: string
    required: true
    label: Title
  author:
    type: string
    required: false
    label: Author
  llm_tags:
    type: list
    items:
      type: string
    required: false
    label: AI-Generated Tags
    description: Tags generated by the LLM tagging plugin
  llm_lead:
    type: text
    required: false
    label: AI-Generated Lead
    description: Summary/lead generated by the LLM tagging plugin
  llm_analyzed:
    type: boolean
    required: false
    label: Analysis Complete
    default: false

defaults:
  status: published
