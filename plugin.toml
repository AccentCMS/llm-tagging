# LLM Tagging Plugin Configuration
# Feature f026a: AI-powered document tagging and lead generation (Phase 1)

[plugin]
name = "llm-tagging"
# 0.2.0 is the 0.1.0 plugin rebuilt on plugin API 0.2.0: `format_tags` reads
# its value as JSON bytes instead of walking the retired arena. A host on that
# API refuses the 0.1.0 build, and this is the version `accent plugin update
# llm-tagging` fetches instead. 0.2.1 drops `localhost` from `allowed_hosts`.
# 0.3.0 adds the `host` provider, which calls the operator's model through the
# `model` host service, and needs a host that provides that service. The plugin
# API version stays 0.2.0, because the service only adds to that API, so an
# older host would accept this manifest and then fail to link the component.
# Publish 0.3.0 to the hub with an `accent_version` floor of the first release
# that has the service: the hub resolver refuses it on an older host, and that
# host keeps 0.2.1.
version = "0.3.0"
api_version = "0.2.0"
description = "AI-powered document tagging and lead generation using LLM providers"
# No loopback entry: the host's outbound transport refuses every loopback
# and private address whatever this list says, and warns at load when the
# list names one. For a model on this machine or the LAN, use the `host`
# provider below; this list is only for the public-API providers.
allowed_hosts = [
    "api.anthropic.com",
    "api.openai.com",
]
# The `host` provider: the host calls the operator's model (`plugins.model`
# in config.yaml) for this plugin. Without this scope, the call is refused.
host_services = ["model"]

# No content hooks: LLM API calls take 2-30 seconds and the synchronous render
# path would block, so analysis is triggered via the route handlers instead.
# (The component's `model-api-plugin` world exports no content-hooks
# interface; a page-load hook returns when hooks can run async -- E034
# post-parity.)

# Custom API routes (Feature f025c).
[routes]
"/api/llm/analyze" = "POST"
"/api/llm/batch" = "POST"
"/api/llm/taxonomy" = "GET"

# Template filters (Feature f025c).
# Usage: {{ page.tags | format_tags }}
# The value names the WIT export that handles the filter; on the component
# contract every filter is dispatched through the single `filters::apply`
# export, keyed on the filter name.
[filters]
format_tags = "apply"

# LLM Provider Configuration
[config.provider]
# Provider type: "host" | "anthropic" | "openai" | "ollama"
# "host" uses the operator's model from `plugins.model` in config.yaml. It
# needs no key, model, or base_url here, and it can reach a model on
# localhost or the LAN.
type = "anthropic"
# Environment variable containing the API key (never store keys in config)
api_key_env = "LLM_API_KEY"
# Model to use for analysis
model = "claude-3-haiku-20240307"
# Custom API endpoint (optional, for self-hosted or compatible APIs)
base_url = ""
# Request timeout in seconds
timeout_seconds = 30

# Tag Generation Settings
[config.tags]
enabled = true
max_tags = 8
min_tags = 3
# Tag formatting style: "lowercase-hyphen", "lowercase", "title-case"
style = "lowercase-hyphen"
# Predefined tags to prefer (helps maintain consistency)
preferred_tags = [
    "rust",
    "web-development",
    "cms",
    "markdown",
    "tutorial",
    "guide",
    "news",
    "release",
]
# Tags to never generate
blocked_tags = [
    "article",
    "post",
    "content",
    "page",
]

# Lead/Summary Generation Settings
[config.lead]
enabled = true
max_length = 200
min_length = 50
# Writing style: "informative", "engaging", "technical", "casual"
style = "informative"

# Workflow Settings
[config.workflow]
# Auto-analyze on page load (disabled by default - too slow for sync hooks)
auto_analyze = false
# Skip analysis if tags/lead already exist in frontmatter
skip_if_exists = true
